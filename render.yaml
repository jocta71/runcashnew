services:
  # Serviço web para o backend Flask
  - type: web
    name: runcash-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend/scraper && python run.py --mongodb --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: runcash
      - key: ALLOWED_ORIGINS
        value: https://runcashnew-frontend-nu.vercel.app,http://localhost:3000
      - key: PRODUCTION
        value: true
      - key: SIMULATE_DATA
        value: false 